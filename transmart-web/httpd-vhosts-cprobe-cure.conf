<VirtualHost *:443>
  ServerName cprobe-transmart.med.umich.edu
  ServerAdmin miktmc-devs@umich.edu  
  ErrorLog /usr/local/apache2/logs/transmart_error_app2.log
  LogLevel warn
  CustomLog /usr/local/apache2/logs/transmart_access_app2.log combined  
  <LocationMatch "^/+$">
    redirect / /transmart
    Options -Indexes
    ErrorDocument 403 /error/noindex.html
  </LocationMatch>

  <Location /transmart>
    ProxyPass        http://tmapp-app2:8080/transmart
    ProxyPassReverse http://tmapp-app2:8080/transmart
  </Location>

  <Location /files>
    ProxyPass        http://tmapp-app2:8080/files
    ProxyPassReverse http://tmapp-app2:8080/files
  </Location>

 SSLEngine on
 SSLCertificateFile /etc/apache2/certs/certificate-app2.pem
 SSLCertificateKeyFile /etc/apache2/certs/private-key-app2.key
 SSLCertificateChainFile /etc/apache2/certs/inc-md-cert-mdq.pem
 SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
 SSLHonorCipherOrder on
 SSLCipherSuite "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH+aRSA+RC4 EECDH EDH+aRSA RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS"

</VirtualHost>
