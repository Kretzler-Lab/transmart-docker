<VirtualHost *:80>
  ServerName miktmc-ap-ps2a.med.umich.edu
  ServerAdmin miktmc-devs@umich.edu
  ErrorLog /usr/local/apache2/logs/transmart_error.log
  LogLevel warn
  CustomLog /usr/local/apache2/logs/transmart_access.log combined
  
  <LocationMatch "^/+$">
    redirect / /transmart
    Options -Indexes
    ErrorDocument 403 /error/noindex.html
  </LocationMatch>

  <Location /transmart>
    ProxyPass        http://tmapp:8080/transmart connectiontimeout=600 timeout=600
    ProxyPassReverse http://tmapp:8080/transmart
  </Location>

  <Location /files>
    ProxyPass        http://tmapp:8080/files
    ProxyPassReverse http://tmapp:8080/files#
  </Location>
</VirtualHost>
