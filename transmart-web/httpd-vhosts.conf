<VirtualHost *:80>
  ServerAdmin support@your-domain.com
  ErrorLog /usr/local/apache2/logs/transmart_error.log
  LogLevel warn
  CustomLog /usr/local/apache2/logs/transmart_access.log combined
  
  <LocationMatch "^/+$">
    redirect / /transmart
    Options -Indexes
    ErrorDocument 403 /error/noindex.html
  </LocationMatch>

  <Location /transmart>
    ProxyPass        http://tmapp:8080/transmart connectiontimeout=600 timeout=600
    ProxyPassReverse http://tmapp:8080/transmart
  </Location>
</VirtualHost>
<VirtualHost *:443>
  ServerAdmin support@your-domain.com
  ErrorLog /usr/local/apache2/logs/transmart_error.log
  LogLevel warn
  CustomLog /usr/local/apache2/logs/transmart_access.log combined
  
  <LocationMatch "^/+$">
    redirect / /transmart
    Options -Indexes
    ErrorDocument 403 /error/noindex.html
  </LocationMatch>

  <Location /transmart>
    ProxyPass        http://tmapp:8080/transmart
    ProxyPassReverse http://tmapp:8080/transmart
  </Location>

  SSLEngine on
  SSLCertificateFile /etc/apache2/certs/neptune.pem
  SSLCertificateKeyFile /etc/apache2/certs/neptune.key
  SSLCertificateChainFile /etc/apache2/certs/inc-md-cert-mdq.pem
  SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
  SSLHonorCipherOrder on
  SSLCipherSuite "EECDH+ECDSA+AESGCM EECDH+aRSA+AESGCM EECDH+ECDSA+SHA384 EECDH+ECDSA+SHA256 EECDH+aRSA+SHA384 EECDH+aRSA+SHA256 EECDH+aRSA+RC4 EECDH EDH+aRSA RC4 !aNULL !eNULL !LOW !3DES !MD5 !EXP !PSK !SRP !DSS"

</VirtualHost>
